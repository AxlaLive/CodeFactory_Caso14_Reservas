spring.application.name=reservas-backend
spring.datasource.url=jdbc:h2:mem:reservasdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
jwt.secret=${JWT_SECRET:EstaEsUnaClaveSecretaMuyLargaParaJWT2026Segura}
jwt.expiration=3600000
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
app.demo-data.client-password=${DEMO_DATA_CLIENT_PASSWORD:}
ai.provider=${AI_PROVIDER:groq}
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
ai.azure-openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
ai.azure-openai.api-key=${AZURE_OPENAI_API_KEY:}
ai.azure-openai.deployment=${AZURE_OPENAI_DEPLOYMENT:}
ai.azure-openai.api-version=${AZURE_OPENAI_API_VERSION:2024-10-21}