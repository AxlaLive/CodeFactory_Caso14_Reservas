spring.application.name=reservas-backend
spring.datasource.url=jdbc:h2:mem:reservasdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
jwt.secret=${JWT_SECRET:EstaEsUnaClaveSecretaMuyLargaParaJWT2026Segura}
jwt.expiration=3600000